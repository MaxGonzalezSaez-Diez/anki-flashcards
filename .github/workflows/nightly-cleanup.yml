name: Nightly Cleanup

on:
  schedule:
    # UTC. Keep in sync with settings.yaml schedule.nightly_cleanup_utc
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      READ_CHAT_GUI_LOG_ROOT: ${{ github.workspace }}/anki_cards_data/Ai-Convo-QA
      READ_CHAT_GUI_GIT_REPO: ${{ github.workspace }}/anki_cards_data
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v4

      - name: Checkout cards repo
        uses: actions/checkout@v4
        with:
          repository: MaxGonzalezSaez-Diez/anki-cards
          path: anki_cards_data
          token: ${{ secrets.QA_FLASHCARDS_REPO_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install python-dotenv pyyaml

      - name: Validate required secrets
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY is empty. Set repository secret OPENROUTER_API_KEY." >&2
            exit 1
          fi

      - name: Run nightly cleanup
        run: python qa/nightly_cleanup.py

      - name: Commit and push cards repo
        working-directory: anki_cards_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add --all -- Ai-Convo-QA/qa/cleaned || true
          git status
          git commit -m "nightly_cleanup $(date +'%Y%m%d_%H%M')" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 5
          done
          exit 1
